name: tutinguard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tutinguard}
      POSTGRES_USER: ${POSTGRES_USER:-tutinguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # no published port: the database is reachable only from the backend

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tutinguard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tutinguard}
      STATIC_DIR: /app/frontend
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      OFFLINE_SECONDS: ${OFFLINE_SECONDS:-30}
      ESCALATE_SECONDS: ${ESCALATE_SECONDS:-60}
      READINGS_KEEP_HOURS: ${READINGS_KEEP_HOURS:-24}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
      AUTO_DISPATCH: ${AUTO_DISPATCH:-confirmed}
      BRIGADE_ETA_S: ${BRIGADE_ETA_S:-45}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TILE_DIR: /app/tiles
      WARMUP_S: ${WARMUP_S:-120}
      REQUERY_S: ${REQUERY_S:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the backend reach Ollama on the host machine
    volumes:
      - ./frontend:/app/frontend:ro
      - ./tiles:/app/tiles          # offline map cache: docker compose exec backend python -m app.tiles
    ports:
      # 127.0.0.1 = only this machine. On a server without Caddy set BACKEND_BIND=0.0.0.0
      - "${BACKEND_BIND:-127.0.0.1}:${HTTP_PORT:-8000}:8000"

  # HTTPS for the server: docker compose --profile https up -d   (needs DOMAIN pointing to the server)
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [backend]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # DB browser for debugging: docker compose --profile debug up -d  → http://localhost:8081
  adminer:
    image: adminer:4
    profiles: ["debug"]
    restart: unless-stopped
    depends_on: [db]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
